<!DOCTYPE html>
<!--/*
    Login page — Thymeleaf port of `templates/security/login.html.twig` (Requirements 7.1–7.4).

    Model:
      * last_username (String) — prefills the username field (Requirement 7.3).
      * error (String, nullable) — last authentication error message; shown as an alert when set
        (Requirements 7.2, 7.4).

    Parity notes vs. the Twig source:
      * Form POSTs to /login with fields `_username` / `_password` (Symfony's default form-login
        parameter names, kept in SecurityConfig).
      * CSRF: Spring Security's token is rendered via ${_csrf} (parameter `_csrf`). The Twig form
        used Symfony's `_csrf_token`/`authenticate` id — an accepted framework-mechanics deviation
        recorded in BEHAVIOR_CHANGES.md (task 6.1 / 10.1).
      * Remember-me: `_remember_me` checkbox (SecurityConfig has rememberMe configured).
      * The Twig hidden `_target_path` (from ?redirect_to=) is intentionally omitted: Spring form
        login uses its saved-request / defaultSuccessUrl mechanism instead of a posted target path.
        Deviation recorded in BEHAVIOR_CHANGES.md.
      * i18n: plain English literals for now (message keys are task 12.1).
      * Demo-credentials help table reproduced from the Twig template for convenience.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Login', 'login', ~{::main})}">
<body>
<main th:fragment="main">
    <h1>Sign in</h1>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
        Authentication error message.
    </div>

    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group mb-3">
            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   name="_username"
                   class="form-control"
                   th:value="${last_username}"
                   required
                   autofocus/>
        </div>

        <div class="form-group mb-3">
            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="_password"
                   class="form-control"
                   required
                   autocomplete="current-password"/>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" id="remember_me" name="_remember_me" class="form-check-input" checked/>
            <label class="form-check-label" for="remember_me">Keep me logged in</label>
        </div>

        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <div class="mt-4">
        <h3>Demo users</h3>
        <p>Use one of the following accounts to sign in (all passwords are <code>kitten</code>):</p>
        <table class="table table-striped table-sm">
            <thead>
                <tr>
                    <th scope="col">Username</th>
                    <th scope="col">Password</th>
                    <th scope="col">Role</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><code>john_user</code></td>
                    <td><code>kitten</code></td>
                    <td>ROLE_USER</td>
                </tr>
                <tr>
                    <td><code>jane_admin</code></td>
                    <td><code>kitten</code></td>
                    <td>ROLE_ADMIN</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
