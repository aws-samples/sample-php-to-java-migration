<!DOCTYPE html>
<!--/*
    Admin edit-post form — Thymeleaf port of `admin/blog/edit.html.twig` (+ its `_form` and
    `_delete_form` partials, inlined). Rendered by AdminBlogController.editForm / re-rendered by
    edit on validation failure (task 11.1). Model: `post` = a prefilled PostDto bound as the form
    object (errors under the `post` object name) and `postId` = the entity id used to build the
    action/show/delete URLs. The form POSTs to `/admin/post/{postId}/edit`.

    Parity notes:
      - Title "Edit post #{postId}".
      - Same fields as the new form; "Save" submit button + "Back to list" link.
      - "Show" link → /admin/post/{postId}.
      - Delete form POSTs to /admin/post/{postId}/delete with a JS confirmation and the standard
        Spring Security `_csrf` hidden input (the PHP `_delete_form` used a custom `token` field;
        here delete relies on Spring's CSRF — see AdminBlogController + BEHAVIOR_CHANGES.md).
    i18n strings are plain English literals for now (MessageSource wiring is task 12.1).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page('Edit Post', 'admin_post_edit', ~{::main})}">
<body>
<main th:fragment="main">
    <h1 th:text="|Edit post #${postId}|">Edit post #1</h1>

    <form th:action="@{/admin/post/{id}/edit(id=${postId})}" method="post" th:object="${post}">
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error message</li>
            </ul>
        </div>

        <div class="form-group mb-3">
            <label for="post_title">Title</label>
            <input type="text" id="post_title" th:field="*{title}" class="form-control">
        </div>

        <div class="form-group mb-3">
            <label for="post_summary">Summary</label>
            <textarea id="post_summary" th:field="*{summary}" class="form-control" rows="2"></textarea>
        </div>

        <div class="form-group mb-3">
            <label for="post_content">Content</label>
            <textarea id="post_content" th:field="*{content}" class="form-control" rows="10"></textarea>
        </div>

        <div class="form-group mb-3">
            <label for="post_publishedAt">Published at</label>
            <input type="text" id="post_publishedAt" th:field="*{publishedAt}" class="form-control"
                   placeholder="yyyy-MM-ddTHH:mm:ss">
        </div>

        <div class="form-group mb-3">
            <label for="post_tags">Tags</label>
            <input type="text" id="post_tags" th:field="*{tags}" class="form-control"
                   placeholder="Comma-separated tags">
        </div>

        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">

        <div class="form-group">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/admin/post/{id}(id=${postId})}" class="btn btn-secondary">Show</a>
            <a th:href="@{/admin/post/}" class="btn btn-link">Back to list</a>
        </div>
    </form>

    <form th:action="@{/admin/post/{id}/delete(id=${postId})}" method="post" id="delete-form"
          class="mt-3" onsubmit="return confirm('Are you sure you want to delete this post?');">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">
        <button type="submit" class="btn btn-danger">Delete post</button>
    </form>
</main>
</body>
</html>
