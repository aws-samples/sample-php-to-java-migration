<!DOCTYPE html>
<!--/*
    Admin post detail — Thymeleaf port of `admin/blog/show.html.twig`. Rendered by
    AdminBlogController.show (task 11.1). Model: `post` = the Post entity. Renders the title,
    metadata (published date + author.fullName), a summary box, the content, and tags, with an
    "Edit" link and a delete form.

    Content parity note: the PHP admin show ran `post.content|markdown_to_html|sanitize_html`.
    The public post_show is handed a pre-rendered `contentHtml` model attribute, but the admin show
    handler exposes only the `post` entity (no pre-rendered HTML), so the raw Markdown content is
    output verbatim as escaped text via th:text (inside a <pre> to preserve line breaks) rather
    than rendered to HTML. This is a documented deviation; see BEHAVIOR_CHANGES.md.

    Delete uses the standard Spring Security `_csrf` token (the PHP `_delete_form` used a custom
    `token` field). i18n strings are plain English literals for now (MessageSource wiring is 12.1).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(${post.title}, 'admin_post_show', ~{::main})}">
<body>
<main th:fragment="main">
    <p class="mb-3">
        <a th:href="@{/admin/post/{id}/edit(id=${post.id})}" class="btn btn-success">Edit</a>
    </p>

    <h1 th:text="${post.title}">Post title</h1>

    <p class="post-metadata">
        <span class="metadata"
              th:text="${T(java.time.format.DateTimeFormatter).ofPattern('MMMM d, yyyy, h:mm a', T(java.util.Locale).ENGLISH).format(post.publishedAt)}">January 1, 2024, 12:00 PM</span>
        <span class="metadata" th:text="${post.author.fullName}">Author Name</span>
    </p>

    <div class="bg-body-tertiary mb-3 p-3 rounded">
        <p class="mb-0"><strong>Summary</strong>: <span th:text="${post.summary}">Post summary.</span></p>
    </div>

    <pre class="post-content" th:text="${post.content}">Post content.</pre>

    <p class="post-tags" th:if="${!post.tags.isEmpty()}">
        <a th:each="tag : ${post.tags}"
           class="badge bg-secondary text-decoration-none"
           th:href="@{/blog/(tag=${tag.name})}"
           th:text="${tag.name}">tag</a>
    </p>

    <form th:action="@{/admin/post/{id}/delete(id=${post.id})}" method="post" id="delete-form"
          class="mt-3" onsubmit="return confirm('Are you sure you want to delete this post?');">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">
        <button type="submit" class="btn btn-danger">Delete post</button>
    </form>
</main>
</body>
</html>
