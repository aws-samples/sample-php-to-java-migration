<!DOCTYPE html>
<!--/*
    Change password — Thymeleaf port of `user/change_password.html.twig`. Rendered by
    UserController.changePassword (task 10.2). Model: `change_password` (the bound
    ChangePasswordDto, carrying binding/validation errors under the `change_password` object name).
    The form POSTs back to `/profile/change-password` (user_change_password); on success the
    controller updates the password, logs the user out, and redirects to the homepage — so the
    user lands on the (anonymous) blog index. An info alert explains this side effect.

    Fields mirror the PHP ChangePasswordType RepeatedType: a new password plus a confirmation.
    i18n strings are plain English literals for now (MessageSource wiring is task 12.1).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page('Change password', 'user_change_password', ~{::main})}">
<body>
<main th:fragment="main">
    <h1>Change password</h1>

    <div class="alert alert-info">
        After changing your password you will be signed out and need to sign in again.
    </div>

    <form th:action="@{/profile/change-password}" method="post" th:object="${change_password}">
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error message</li>
            </ul>
        </div>

        <div class="form-group mb-3">
            <label for="change_password_newPassword">New password</label>
            <input type="password" id="change_password_newPassword"
                   th:field="*{newPassword}" class="form-control">
        </div>

        <div class="form-group mb-3">
            <label for="change_password_confirmPassword">Repeat password</label>
            <input type="password" id="change_password_confirmPassword"
                   th:field="*{confirmPassword}" class="form-control">
        </div>

        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">

        <div class="form-group">
            <button type="submit" class="btn btn-primary">Save new password</button>
            <a class="btn btn-link" th:href="@{/profile/edit}">Back to profile</a>
        </div>
    </form>
</main>
</body>
</html>
