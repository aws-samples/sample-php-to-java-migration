<!DOCTYPE html>
<!--/*
    Profile edit — Thymeleaf port of `user/edit.html.twig`. Rendered by UserController.edit
    (task 10.2). Model: `user` (the bound UserDto, carrying binding/validation errors under the
    `user` object name) and, after a successful POST, a `flash_success` message (flash attribute)
    shown as a success alert. The form POSTs back to `/profile/edit` (user_edit) and, on success,
    the controller redirects 303 back here with the flash. A "Change password" link points at
    `/profile/change-password` (user_change_password).

    i18n strings are plain English literals for now (MessageSource wiring is task 12.1).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page('Edit your profile', 'user_edit', ~{::main})}">
<body>
<main th:fragment="main">
    <h1>Edit your profile</h1>

    <div class="alert alert-success" th:if="${flash_success}" th:text="${flash_success}">
        User updated successfully.
    </div>

    <form th:action="@{/profile/edit}" method="post" th:object="${user}">
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <ul class="mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error message</li>
            </ul>
        </div>

        <div class="form-group mb-3">
            <label for="user_username">Username</label>
            <input type="text" id="user_username" th:field="*{username}" class="form-control">
        </div>

        <div class="form-group mb-3">
            <label for="user_fullName">Full Name</label>
            <input type="text" id="user_fullName" th:field="*{fullName}" class="form-control">
        </div>

        <div class="form-group mb-3">
            <label for="user_email">Email</label>
            <input type="email" id="user_email" th:field="*{email}" class="form-control">
        </div>

        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">

        <div class="form-group">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-link" th:href="@{/profile/change-password}">Change password</a>
        </div>
    </form>
</main>
</body>
</html>
